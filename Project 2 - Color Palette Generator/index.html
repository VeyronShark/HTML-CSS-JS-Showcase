<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Color Palette Generator</title>
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
            integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>

    <body>
        <div class="container">
            <h1>Color Palette Generator</h1>

            <button id="generate-btn">
                <i class="fas fa-sync-alt"></i>
                Generate Pallete
            </button>

            <div class="palette-container">
                <div class="color-box">
                    <div class="color" style="background-color: red"></div>
                    <div class="color-info">
                        <span class="hex-value">red</span>
                        <i
                            class="far fa-copy copy-btn"
                            title="Copy to clipboard"
                        ></i>
                    </div>
                </div>

                <div class="color-box">
                    <div class="color" style="background-color: orange"></div>
                    <div class="color-info">
                        <span class="hex-value">orange</span>
                        <i
                            class="far fa-copy copy-btn"
                            title="Copy to clipboard"
                        ></i>
                    </div>
                </div>

                <div class="color-box">
                    <div class="color" style="background-color: yellow"></div>
                    <div class="color-info">
                        <span class="hex-value">yellow</span>
                        <i
                            class="far fa-copy copy-btn"
                            title="Copy to clipboard"
                        ></i>
                    </div>
                </div>

                <div class="color-box">
                    <div class="color" style="background-color: green"></div>
                    <div class="color-info">
                        <span class="hex-value">green</span>
                        <i
                            class="far fa-copy copy-btn"
                            title="Copy to clipboard"
                        ></i>
                    </div>
                </div>

                <div class="color-box">
                    <div class="color" style="background-color: blue"></div>
                    <div class="color-info">
                        <span class="hex-value">blue</span>
                        <i
                            class="far fa-copy copy-btn"
                            title="Copy to clipboard"
                        ></i>
                    </div>
                </div>
            </div>
        </div>
    </body>

    <script src="script.js"></script>
</html>
